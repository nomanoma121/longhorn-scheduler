name: Chart

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CHART_DIR: helm
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Lint
        run: helm lint "$CHART_DIR"

      - name: Render
        run: helm template test "$CHART_DIR" > /dev/null

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" -d dist

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: helm push dist/*.tgz "$CHART_REPO"
