apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.schedulerName }}
  namespace: {{ .Values.namespace }}
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    profiles:
      - schedulerName: {{ .Values.schedulerName }}
        plugins:
          multiPoint:
            enabled:
              - name: LonghornScheduler
        pluginConfig:
          - name: LonghornScheduler
            args:
              nodeReservationTimeoutSeconds: {{ .Values.plugin.nodeReservationTimeoutSeconds }}
